name: Test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The bracketed regex keeps this step from matching its own source line,
      # so the workflow file itself stays covered by the sweep. Case-insensitive
      # because the stale domain also appeared capitalised in prose.
      - name: Stale domain guard
        run: |
          if grep -rniI "pulse[.]pubky[.]org" \
            --exclude-dir=.git --exclude-dir=.build .; then
            echo "::error::Stale domain reintroduced above; use pubkypulse.com."
            exit 1
          fi

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --skip SDKIntegrationTests --skip AppleSearchAdsAttributionTests
