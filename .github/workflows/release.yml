name: Auto-tag release

# Triggered by pushes to main. paths-ignore skips Examples/docs/gitignore-only
# pushes — note this also skips pushes that change zero paths (empty commits).
# The bot's bump commit uses [skip ci] so this workflow doesn't loop on itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'Examples/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  wait-for-tests:
    name: Wait for Test workflow
    runs-on: ubuntu-latest
    steps:
      # "Unit tests" is the display name of the job in test.yml. The two must
      # stay in step: a regexp that matches nothing waits until the job times out.
      - name: Wait for unit tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: "Unit tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  tag:
    name: Bump and tag
    needs: wait-for-tests
    runs-on: ubuntu-latest
    permissions:
      # The job pushes the release commit and the tag back to main.
      contents: write
    env:
      # Single source of truth for the released version. There is no package
      # registry step: Swift Package Manager resolves straight from the git tag,
      # so tagging *is* publishing and this constant is the only thing that has
      # to be written back.
      VERSION_FILE: Sources/PubkyPulse/Core/PubkyPulseVersion.swift
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: ver
        run: |
          # PubkyPulseVersion.current is the source of truth for the current
          # version: every release commit writes the released version back into
          # it, so it is never behind the newest tag on main.
          #
          # It is deliberately NOT derived from `git tag -l`. This repository's
          # history descends from an earlier project whose tags climbed into the
          # 0.14.x range and still live on other remotes; a single one of those
          # reaching origin would silently drag the next release up with it.
          # Do not reintroduce a tag-derived version.
          #
          # extract_version quits at the first matching line, so there is no
          # `head` in a pipeline: under `set -o pipefail` a closed pipe would
          # surface as an unexplained step failure.
          extract_version() {
            sed -n -E '/public static let current = /{ s/.*= "([^"]*)".*/\1/p; q; }'
          }

          current=$(extract_version < "$VERSION_FILE")
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a semver version from $VERSION_FILE (got '${current:-<none>}')" >&2
            exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$current"

          # Pull requests land on main as GitHub merge commits, whose subject is
          # always "Merge pull request #N from owner/branch" — the conventional
          # commit title lives in the body. Reading only %s would therefore make
          # every merge a patch bump, including a breaking "refactor!:" one, so
          # for a merge commit the effective subject is the first non-empty body
          # line. Squash merges and direct commits already carry the prefix in
          # the subject and keep using it. Do not simplify this back to %s.
          subject=$(git log -1 --pretty=%s ${{ github.sha }})
          body=$(git log -1 --pretty=%b ${{ github.sha }})
          full=$(git log -1 --pretty=%B ${{ github.sha }})

          msg="$subject"
          if [[ "$subject" == "Merge pull request #"* || "$subject" == "Merge branch "* ]]; then
            body_line=$(printf '%s\n' "$body" | grep -m1 -v '^[[:space:]]*$' || true)
            if [[ -n "$body_line" ]]; then
              msg="$body_line"
            fi
          fi

          # feat!:/fix!:/BREAKING CHANGE → major; feat:/feat(...) → minor; else patch.
          # BREAKING CHANGE is matched against the full commit message because
          # Conventional Commits puts it in a footer, not in the subject.
          # Pre-1.0 semver convention: while MAJ is 0 the API is unstable, so a
          # breaking marker bumps minor instead of jumping straight to 1.0.0.
          # The first major release happens manually (tag v1.0.0 by hand) — this
          # workflow only takes over once the project is past 0.x.
          if [[ "$msg" == *"!:"* || "$full" == *"BREAKING CHANGE"* ]]; then
            if [[ "$MAJ" == "0" ]]; then
              MIN=$((MIN+1)); PAT=0
            else
              MAJ=$((MAJ+1)); MIN=0; PAT=0
            fi
          elif [[ "$msg" == feat:* || "$msg" == feat\(* ]]; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi

          version="${MAJ}.${MIN}.${PAT}"
          # Never tag a version that is not strictly above the one in the repo.
          if [[ "$version" == "$current" ]] || \
             [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "Computed version $version is not above $VERSION_FILE version $current" >&2
            exit 1
          fi
          next="v${version}"

          # Rerun safety: if a previous run pushed main but then failed (release
          # creation), main is ahead of the event SHA and the tag is already
          # there. A rerun checks out the same SHA and computes the same version,
          # so the tag is the signal that this release already happened —
          # locally (the checkout fetches tags) or on the remote.
          #
          # The tag EXISTING is not enough on its own. Any tag of that name
          # matches: one left over from earlier history (this repository has
          # plenty), restored from a backup, or created by hand. On such a tag
          # the workflow wedges silently and permanently: "Commit, tag, push" is
          # skipped so the bump never lands on main, main's version constant
          # stays at the old value, the next push recomputes the same version,
          # finds the same tag and skips again — and no run ever goes red.
          # Versions simply stop advancing and nothing says so.
          #
          # So only count the tag when it is THIS release's tag: the commit it
          # points at must carry the computed version in its version constant,
          # which is what the bump commit a genuine rerun looks at does. Any
          # unrelated tag leaves the guard false, and the atomic push below then
          # fails loudly because the tag already exists — a visible error a human
          # can act on. Do not simplify this back to bare tag existence.
          already_released=false
          tag_ref=""
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            tag_ref="refs/tags/$next"
          elif [[ -n "$(git ls-remote --tags origin "refs/tags/$next")" ]]; then
            # Created after this job's checkout: fetch it so it can be inspected
            # the same way as a tag that was already local.
            git fetch --no-tags origin "refs/tags/$next:refs/tags/$next"
            tag_ref="refs/tags/$next"
          fi

          if [[ -n "$tag_ref" ]]; then
            # A tagged commit with no version file, or an unparseable one, reads
            # as empty here rather than failing the step.
            tagged_source=$(git show "$tag_ref^{commit}:$VERSION_FILE" 2>/dev/null || true)
            tagged_version=$(printf '%s\n' "$tagged_source" | extract_version)
            if [[ "$tagged_version" == "$version" ]]; then
              already_released=true
            else
              echo "::warning::Tag $next already exists but the version constant at that tag says '${tagged_version:-<none>}', not $version, so it is not this release. Not skipping the release steps; the tag push will fail loudly if that tag is in the way."
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "already_released=$already_released" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from '$msg'), already released: $already_released"

      # Skipped when the tag already exists, which is what a rerun of a
      # partially-failed release looks like: main already carries the bump
      # commit, so committing and pushing again would fail non-fast-forward and
      # strand the release. The release step below has its own skip-if-exists
      # guard, so a rerun completes only the parts that are missing.
      - name: Commit, tag, push
        if: ${{ steps.ver.outputs.already_released != 'true' }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          # The constant is plain semver, with no leading "v".
          sed -i -E "s/(public static let current = )\"[^\"]*\"/\1\"$VERSION\"/" "$VERSION_FILE"
          written=$(sed -n -E '/public static let current = /{ s/.*= "([^"]*)".*/\1/p; q; }' "$VERSION_FILE")
          if [[ "$written" != "$VERSION" ]]; then
            echo "Failed to write $VERSION into $VERSION_FILE (it now reads '${written:-<none>}')" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "chore: release $NEXT [skip ci]"
          git tag "$NEXT"
          # --atomic is load-bearing: the branch and the tag move together or
          # not at all. The rerun guard above keys on the tag existing, so a
          # push that landed the bump commit on main without the tag would make
          # that guard lie — the rerun would not skip, would build a second bump
          # commit on the original SHA, and would die non-fast-forward with the
          # release stranded. Do not split these back into two pushes.
          git push --atomic origin main "$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          for i in 1 2 3; do
            if gh release view "$NEXT" >/dev/null 2>&1; then
              echo "Release $NEXT already exists, skipping"
              exit 0
            fi
            if gh release create "$NEXT" --title "$NEXT" --generate-notes; then
              exit 0
            fi
            echo "gh release create attempt $i failed; sleeping 15s..."
            sleep 15
          done
          echo "Failed to create release after 3 attempts"
          exit 1
